# robot-sdk declaration: the shared types this package's public API takes (consumes) and gives (produces),
# each with the symbols that are the contract. Checked against the code by robot_sdk's
# `python -m tools.sdk_graph check` (docs/graph-schema.md in github.com/zacharyyamaoka/robot_sdk).
schema = "robot-sdk-declaration/1"
role = "library"
layer = "leaf"
one_line = "Trajectory kinds from limits and tasks, one JointTrajectory out"
summary = "A signal library for robot motion. Every trajectory kind is a `TrajectoryGenerator`: a plain function `f(JointSpace, numbers/points/poses) → JointTrajectory`, inside the limits and at rest at both ends. ~80 kinds: moves, waypoints (joint and Cartesian), random waypoints, pick and place, chirps, multisines, PRBS, step trains, PID tuning, friction ID, ISO 9283 tests, workspace sweeps, moving targets. `chain` / `split` to compose. The legs inside a kind are timed by a `WaypointTrajectoryGenerator` (points + joint limits in, a JointTrajectory out: minimum_jerk, trapezoid, ruckig, ruckig_pro, toppra as plugins), passed as `waypoint_generator=`. The robot (limits, FK/IK, dynamics, collision) is injected via `JointSpace`."
use_when = "Generating any motion: test trajectories, excitation for system ID, pick-and-place paths, tuning signals, benchmarks."

# Where to read more. github and pypi are required; the rest are what this package has.
[links]
github = "https://github.com/zacharyyamaoka/robot_trajectories"
pypi = "https://pypi.org/project/robot-trajectories/"
docs = "https://github.com/zacharyyamaoka/robot_trajectories/tree/main/docs/peps"
site = "https://zacharyyamaoka.github.io/robot_trajectories/"

[[consumes]]
type = "robot_msgs.trajectory.JointLimits"
symbols = [
  "robot_trajectories.space.JointSpace.from_limits",
  "robot_trajectories.waypoint_trajectory_generator.WaypointTrajectoryGenerator.__call__",
  "robot_trajectories.kernels.to_trajectory",
]

[[produces]]
type = "robot_msgs.trajectory.JointLimits"
symbols = [
  "robot_trajectories.space.limits_from_json",
]

[[consumes]]
type = "robot_msgs.trajectory.JointTrajectory"
symbols = [
  "robot_trajectories.segments.chain",
  "robot_trajectories.segments.split",
  "robot_trajectories.recipe.rebuild",
]

[[produces]]
type = "robot_msgs.trajectory.JointTrajectory"
symbols = [
  "robot_trajectories.kernels.to_trajectory",
  "robot_trajectories.registry.kind",
  "robot_trajectories.recipe.rebuild",
  "robot_trajectories.waypoint_trajectory_generator.WaypointTrajectoryGenerator.__call__",
]

[[produces]]
type = "robot_msgs.trajectory.PoseTrajectory"
symbols = [
  "robot_trajectories.moving.target_from_record",
]

[[consumes]]
type = "robot_msgs.trajectory.Trajectory"
symbols = [
  "robot_trajectories.trajectory_generator.TrajectoryGenerator.__call__",
]
