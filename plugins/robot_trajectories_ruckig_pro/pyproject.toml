[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robot-trajectories-ruckig-pro"
version = "0.1.0"
description = "Ruckig Pro (the local build) as a drop-in for the robot_trajectories time parameterization 'ruckig': local intermediate waypoints and position limits."
authors = [{ name = "Zach Yamaoka" }]
requires-python = ">=3.11"
# WHY ruckig-pro from the workspace checkout, pinned (bam_traj_gen's pyproject, the same pin): the licensed Pro source is
# built here, locally, so intermediate waypoints are solved on this machine and never by Ruckig's cloud API.
# WHY never installed beside robot-trajectories-ruckig: both register the time parameterization 'ruckig', and ruckig /
# ruckig-pro own the same 'ruckig' module, so install order would pick the binary. Install exactly one of the two. The backend
# refuses to load beside the 'ruckig' distribution, and robot_trajectories refuses two providers of one time parameterization.
dependencies = ["robot-trajectories>=0.1.0", "ruckig-pro==0.19.4", "numpy>=1.26"]

[project.entry-points."robot_trajectories.time_parameterizations"]
ruckig = "robot_trajectories_ruckig_pro:RuckigProBackend"

[tool.uv.sources]
# WHY this exact path: the checkout bam_traj_gen builds (its ruckig_backend.require_local_ruckig_pro pins the same name and
# version); the backend verifies at load that the installed distribution came from it (direct_url.json).
ruckig-pro = { path = "/home/bam/bam_ws/src/external/ruckig-pro-v0.19.4-obfuscated-code" }
robot-trajectories = { path = "/home/bam/robot_trajectories", editable = true }
robot-msgs = { path = "/home/bam/robot_msgs", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/robot_trajectories_ruckig_pro"]

[tool.ruff]
line-length = 130
